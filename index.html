<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Quản lý Dòng tiền</title>
    <meta name="description" content="Quản lý dòng tiền & ngân quỹ nội bộ doanh nghiệp" />
    <meta name="theme-color" content="#0f1e3a" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Dòng tiền" />
    <script>
      // iPhone/iPad: không khai báo chế độ "app toàn màn hình" vì đăng nhập Google không chạy được trong chế độ đó;
      // biểu tượng trên màn hình chính sẽ mở bằng Safari. Thiết bị khác: cài như ứng dụng.
      (function () {
        var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (!ios) {
          var l = document.createElement('link');
          l.rel = 'manifest';
          l.href = './manifest.webmanifest';
          document.head.appendChild(l);
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap&subset=vietnamese"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
